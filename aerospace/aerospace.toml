enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
start-at-login = true

[mode.main.binding]
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

alt-shift-f = 'macos-native-fullscreen'
alt-e = 'layout tiles horizontal vertical'
alt-shift-space = 'layout floating tiling'

alt-shift-r = 'reload-config'
alt-shift-h = 'resize smart -50'
alt-shift-l = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

cmd-enter = 'exec-and-forget open -a Alacritty'     # Terminal
alt-b = 'exec-and-forget open -a Firefox'       # Browser
alt-s = 'exec-and-forget open -a Spotify'       # Music
alt-o = 'exec-and-forget open -a Discord'       # Chat / Community
alt-f = 'exec-and-forget open -a Finder'        # File manager
alt-m = 'exec-and-forget open -a Messages'      # iMessage
alt-p = 'exec-and-forget open -a "System Settings"' # Quick access
alt-d = 'exec-and-forget open -a "Mail"'        # Mail client

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.photobooth'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.facetime'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = ['layout floating']


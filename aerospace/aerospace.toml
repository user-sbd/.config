enable-normalization-opposite-orientation-for-nested-containers = false
enable-normalization-flatten-containers = false
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
start-at-login = true

# after-startup-command = [
#     'exec-and-forget sketchybar',
# ]
#
# exec-on-workspace-change = ['sketchybar --trigger aerospace_workspace_change']

[mode.main.binding]
alt-p = 'exec-and-forget ~/.config/scripts/choos.sh'

alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

alt-shift-m = 'macos-native-fullscreen'
alt-e = 'layout tiles horizontal vertical'
alt-shift-space = 'layout floating tiling'

alt-shift-c = 'reload-config'
alt-shift-h = 'resize smart -50'
alt-shift-l = 'resize smart +50'

alt-a = 'workspace term'
alt-s = 'workspace browser'
alt-d = 'workspace music'
alt-f = 'workspace notes'
alt-g = 'workspace disc'
alt-y = 'workspace photo'
alt-j = 'workspace setting'
alt-k = 'workspace rand'
alt-o = 'workspace rand'

alt-shift-a = 'move-node-to-workspace term'
alt-shift-s = 'move-node-to-workspace browser'
alt-shift-d = 'move-node-to-workspace music'
alt-shift-f = 'move-node-to-workspace notes'
alt-shift-g = 'move-node-to-workspace disc'
alt-shift-y = 'move-node-to-workspace photo'
alt-shift-j = 'move-node-to-workspace setting'
alt-shift-k = 'move-node-to-workspace rand'
alt-shift-o = 'move-node-to-workspace rand'

alt-comma = 'workspace prev'
alt-period = 'workspace next'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.photobooth'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.facetime'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.QuickTimePlayerX'
run = ['layout floating']

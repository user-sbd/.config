set-option -g prefix C-a
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"
set -g allow-passthrough on
set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi
set -g status-interval 1
set -g status on

set -g status-left-length 100
set -g status-right-length 100
set -g status-style "fg=#cdcdcd,bg=default"
set -g status-justify absolute-centre
set -g message-style "fg=#252530,bg=default"
set -g status-left "#[fg=#cdcdcd,bg=default] #S "
# set -g status-right ""
set -g status-right '#{?client_prefix, _ ,}#(timew | awk "/^ *Tracking/ {print \" \" \$NF \" \"}")#[bg=default]'
setw -g window-status-separator " "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g status-style 'fg=white'
setw -g window-status-current-style bg=blue,bold,fg=black
set -g focus-events on
set-option -g status-position top

bind-key -T copy-mode-vi 'v' send -X begin-selection

setw -g mode-keys vi
bind "'" split-pane -v
bind Space switch-client -l
bind '\' split-pane -h
bind - split-pane -v

bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5
bind-key -r K resize-pane -U 5
bind-key -r J resize-pane -D 5

bind c new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind a split-window -h \; send-keys 'ai' C-m
bind r source-file ~/.config/tmux/tmux.conf 
bind x kill-pane 
bind f neww "~/.config/scripts/tmux.sh"
bind t neww "~/.config/scripts/time"
bind k run-shell "~/.config/scripts/unused.sh"
bind g run-shell "~/.config/scripts/git.sh"
bind G neww -n "git" -c "#{pane_current_path}" lazygit"

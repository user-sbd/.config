set-option -g prefix C-a
bind r source-file ~/.config/tmux/tmux.conf 
unbind C-b
set -g renumber-windows on  
set -g base-index 1
set -g escape-time 0       
set -g status-style "bg=default"
set -g status-position top
set -g status-justify absolute-centre
set -g status-left " #S"
set -g status-left-length "20"
set -g status-right ""
set -g status-interval 5

set -g window-status-style "fg=white"
set -g window-status-current-style "fg=white,bg=#3f3f3f"

setw -g window-status-format '#I:#W'
setw -g window-status-current-format '#I:#W'
setw -g mode-keys vi
bind "'" split-pane -v
bind Space switch-client -l
bind | split-pane -h

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5

bind c new-window -c "#{pane_current_path}"
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind x kill-pane 
bind k run-shell "~/.config/scripts/unused.sh"
bind G run-shell "~/.config/scripts/git.sh"
bind o neww "~/.config/scripts/zath.sh"
bind f neww "~/.config/scripts/tmux.sh"
bind w neww "~/.config/scripts/time.sh"
bind m neww "~/.config/scripts/man.sh"
bind g neww -n git -c "#{pane_current_path}" "lazygit"
bind E show-environment -g

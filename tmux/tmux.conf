set-option -g prefix C-a
set -g renumber-windows on  
set -g base-index 1
set -g escape-time 0       
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"
set-option -g status-position top
set-option -g popup-border-lines none
bind-key -T copy-mode-vi 'v' send -X begin-selection

set -g status-style 'bg=#333333 fg=#5eacd3'
set -g pane-active-border-style 'fg=white'
set -g focus-events on
set -g status-style bg=default
set -g status-left ' #S'
set -g status-right ''
set -g status-left-length 99
set -g status-justify absolute-centre
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '
set -g window-status-separator ' '
setw -g window-status-current-style 'bg=#6A9FB5,fg=black,bold'
setw -g window-status-style 'bg=default,fg=white'

setw -g mode-keys vi
bind "'" split-pane -h
bind Space switch-client -l
bind | split-pane -h
bind - split-pane -v

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind-key -r h resize-pane -L 1
bind-key -r l resize-pane -R 1
bind-key -r k resize-pane -U 1
bind-key -r j resize-pane -D 1

bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5

bind c new-window -c "#{pane_current_path}"
bind a split-window -h \; send-keys 'ai' C-m
bind r source-file ~/.config/tmux/tmux.conf 
bind x kill-pane 
bind k run-shell "~/.config/scripts/unused.sh"
bind g run-shell "~/.config/scripts/git.sh"
bind o neww "~/.config/scripts/zath.sh"
bind f neww "~/.config/scripts/tmux.sh"
bind -n C-f neww "~/.config/scripts/tmux.sh"
bind v new-window -c "#{pane_current_path}" "lazygit"
